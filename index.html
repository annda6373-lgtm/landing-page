<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Continue Watching</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#160d25,#42204f,#101018);
  color: white;
}

.container {
  width: 100%;
  max-width: 550px;
  padding: 18px;
  background: #21182c;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 40px #0008;
}

.thumbnail {
  width: 100%;
  height: auto;
  border-radius: 14px;
  display: block;
}

h1 {
  font-size: 28px;
  margin: 22px 0 10px;
}

p {
  color: #ddd;
  line-height: 1.6;
  font-size: 16px;
}

.notice {
  background: #ffffff12;
  padding: 15px;
  border-radius: 12px;
  margin: 20px 0;
  font-size: 14px;
  line-height: 1.6;
}

.btn {
  display: block;
  padding: 17px;
  margin-top: 15px;
  border-radius: 12px;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
}

.continue {
  background: linear-gradient(90deg,#ff1744,#e60035);
  color: white;
}

.leave {
  background: #ffffff15;
  color: white;
  border: 1px solid #ffffff30;
}

.footer {
  font-size: 12px;
  color: #aaa;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <img
    src="thumbnail.png"
    alt="Video thumbnail"
    class="thumbnail"
  >

  <h1>Continue Watching</h1>

  <p>
    Yahan aapko milenge new viral videos.
  </p>

  <div class="notice">
    Aage badhne se pehle confirm karein ki
    aap apne location ki legal age requirement
    poori karte hain.
  </div>

  <a
    class="btn continue"
    href="https://auctionr.org/4/d0fdb7cd7f9750b1010a0782529a0a29"
    rel="nofollow sponsored noopener">
    CONTINUE
  </a>

  <a
    class="btn leave"
    href="https://www.google.com/">
    LEAVE PAGE
  </a>

  <div class="footer">
    No automatic redirects.
  </div>

</div>

</body>
</html>
